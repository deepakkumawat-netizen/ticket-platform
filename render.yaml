# Render Blueprint — ONE combined web service (backend serves the built
# frontend itself, see backend/src/app.module.ts's ServeStaticModule) plus a
# free Redis-compatible store. Native Node runtime throughout — NO Docker.
#
# Deploy: push this repo to GitHub, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions everything below in one go.
#
# Postgres is deliberately NOT provisioned here — Render's own Postgres has
# no free tier for new databases. Use a free external Postgres (e.g.
# Neon.tech), and paste its connection string into DATABASE_URL below via
# the Render dashboard after the first deploy (it's marked sync: false, so
# Render will prompt for it instead of guessing a value).

services:
  # Redis-compatible store for BullMQ (SLA breach checks, notification
  # dispatch — see backend/src/sla, not yet built). Free tier has no disk
  # persistence, which is fine for a job queue.
  - type: keyvalue
    name: ticketplatform-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0

  # Backend + frontend in one service: the build compiles both, the backend
  # then serves the frontend's static files itself (same origin, same port)
  # while its own API stays under /api — no second service, no separate
  # frontend URL to keep in sync.
  - type: web
    name: ticketplatform
    runtime: node
    plan: free
    buildCommand: >-
      npm install &&
      npm run build --workspace packages/shared &&
      npx prisma generate --schema=backend/prisma/schema.prisma &&
      npm run build --workspace backend &&
      npm run build --workspace frontend
    # `prisma migrate deploy` is deliberately NOT run here. It uses Prisma's
    # CLI/migrate engine, a separate Rust component that resolves/connects
    # to the DB itself and (confirmed live) cannot reliably reach Neon from
    # Render's network. The app itself connects fine — see
    # prisma.service.ts's Neon serverless driver adapter (HTTPS/WebSocket,
    # not raw TCP+DNS). Run migrations manually from a machine that can
    # reach the DB directly instead:
    #   DATABASE_URL="<neon connection string>" npx prisma migrate deploy --schema=backend/prisma/schema.prisma
    startCommand: node backend/dist/src/main.js
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon (or other Postgres) connection string here
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketplatform-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong random secret at deploy time
      - key: JWT_ACCESS_TTL
        # There's no refresh-token flow yet (see auth.service.ts), so a short
        # TTL just forces frequent re-logins with no security benefit today.
        # 8h covers a full working session; tighten this once refresh tokens
        # exist.
        value: 8h
      - key: GEMINI_API_KEY
        sync: false # paste a key from aistudio.google.com/apikey — AI features (backend/src/ai) 400 with a clear message until this is set
      - key: GEMINI_MODEL
        value: gemini-3.7-flash # override here if this default is ever wrong/retired — see gemini.service.ts
      # Fallback AI provider (backend/src/ai/groq.service.ts) — used only
      # when Gemini fails and this is set. Added because a free-tier Gemini
      # key caps at 5 requests/minute for the whole app; Groq's free tier is
      # far more generous. Get a key at console.groq.com/keys (free, no
      # card needed). Leaving this unset is safe — AI features just keep
      # relying on Gemini alone, same as before this existed.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile # override here if this default is ever retired — see groq.service.ts
      - key: SIGNUP_ALLOWED_EMAIL_DOMAINS
        value: codevidhya.com # comma-separated; public EMPLOYEE self-signup (auth.service.ts) only accepts these domains
      # Escalation-notification emails (backend/src/notifications/mailer.service.ts).
      # Leaving these unset is safe — MailerService just logs and skips
      # sending instead of throwing. Using Gmail: smtp.gmail.com / 587 /
      # your Gmail address for both USER and FROM / a 16-character "App
      # Password" (NOT your normal Gmail password) from
      # myaccount.google.com/apppasswords, which requires 2-Step
      # Verification to be turned on first.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Invisible bot-check (Google reCAPTCHA v3) on login/signup — register
      # at google.com/recaptcha/admin/create (type v3; add this service's
      # domain + localhost). Leaving RECAPTCHA_SECRET_KEY unset is safe:
      # RecaptchaService just skips verification instead of blocking login.
      # VITE_RECAPTCHA_SITE_KEY isn't secret (it's public by design) but
      # still needs pasting here since the frontend build (this same
      # buildCommand) bakes it into the built JS bundle at build time.
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_MIN_SCORE
        value: "0.5"
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
